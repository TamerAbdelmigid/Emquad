[package]
name = "emquad"
version = "0.1.0"
description = "Offline desktop LaTeX editor"
authors = ["Emquad"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emquad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Compiles the test harness (src/e2e.rs) into a release build. Never used for the installer.
e2e = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
similar = "3.2.0"
flate2 = "1.1.10"
regex = "1.13.1"
notify = "8.2.0"
chrono = "0.4.45"
uuid = { version = "1.28.0", features = ["v4"] }
ts-rs = "12.0.1"
tempfile = "3.27.0"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
